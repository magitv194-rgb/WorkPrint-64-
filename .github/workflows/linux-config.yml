name: WorkPrint Linux configuration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-live-image:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install live-build
        run: |
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            sed -i 's/^Components: main$/Components: main contrib non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          fi
          apt-get update
          apt-get install -y --no-install-recommends live-build ca-certificates
      - name: Check configuration scripts and package list
        run: tools/check-live-config.sh
      - name: Resolve requested packages against Debian Trixie
        run: |
          packages="$(awk '!/^[[:space:]]*#/ && NF {print}' live/config/package-lists/workprint.list.chroot)"
          apt-get -s install $packages
      - name: Generate live-build configuration
        run: tools/configure-live-build.sh
